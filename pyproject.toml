[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docslint"
version = "0.1.0"
description = "Lint Markdown documentation for common structural problems"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
docslint = "docslint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
